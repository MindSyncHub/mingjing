name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install ruff pytest -r backend/requirements.txt
      - name: Lint
        run: ruff check backend
      - name: Test
        run: python -m pytest backend/tests -q
